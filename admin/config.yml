# Decap CMS config — Stage 1 (FAQ) + Stage 2a (Team) + Stage 2b (Blog) +
# Stage 2c (Timeline) + Stage 2d (Pitch Videos) + Stage 2e (Gallery) +
# Stage 2f (About Page) + Stage 2g (Home Page + shared Site Settings) +
# Stage 2h (How It Works Page).
#
# Stage 1 wired up exactly ONE collection, FAQ, to prove the whole login
# -> edit -> commit -> deploy pipeline before migrating anything else.
# Stage 2a added Team (the Leadership page's board members). Stage 2b
# added Blog (blog.html's post grid + each post's own page, blog-post.html
# — NOT the newsletter section on that same page, which stays exactly as
# it was: hardcoded, non-functional signup, untouched by this collection).
# Stage 2c added Timeline (timeline.html's event track AND the Countdown
# widget on both timeline.html and index.html, which reads the same
# underlying data so the two can never fall out of sync — see
# initTimelineContent in js/script.js). Stage 2d added Pitch Videos
# (pitch-videos.html's coverflow carousel) — its video field's `hint`
# carries the real-video-consent warning that used to live only as a
# code comment, since exec board members editing here need to see it in
# THIS interface, not in source they'll never open. Stage 2e adds Gallery
# (gallery.html's bento photo grid) — deliberately no tile-size field:
# each photo's bento shape is assigned automatically by rendered position
# (see GALLERY_SIZES in js/script.js), since this collection is meant to
# keep growing indefinitely, unlike the others' fixed rosters/sequences.
# Stage 2f adds About (about.html) — structurally different from every
# collection above: it's a single document (Decap's `files` collection
# type), not a repeatable `list`, since the page has one fixed set of prose
# sections rather than a growing/reorderable roster. Each value pillar's
# icon and accent color are still assigned automatically by position (see
# ABOUT_VALUE_ICONS/ABOUT_VALUE_ACCENTS in js/script.js) — same reasoning as
# Gallery's tile sizing — so adding/removing/reordering a value never needs
# a layout decision here.
#
# Stage 2g adds Home (index.html) — the highest-risk migration so far: this
# page's hero/explainer/impact/top-teams/story/CTA sections are built on
# several interlocking pinned, scroll-scrubbed GSAP systems (see
# initPinSequence/initTopTeamsAnimation/initStoryEntranceFade/
# initImpactCounters, js/script.js), all wired directly to specific
# existing classes/ids/data-attributes in index.html. Home's own document
# (single `files` entry, like About) updates that existing markup IN PLACE
# rather than rebuilding it from a template, to avoid disturbing any of
# those systems. Top Teams is the one list field on this document: each
# entry's Placement (1st/2nd/3rd, a dropdown — not the entry's position in
# this list) decides which fixed podium slot, accent, and badge it becomes,
# so reordering this list, or putting "1st" anywhere in it, never breaks
# the podium order or which team's card gets the confetti burst (see
# renderTopTeamsPodium, js/script.js). Stage 2g also adds Site Settings — a
# second, SEPARATE single document (not nested under Home) for the
# Instagram URL and contact email repeated across the Home hero and every
# page's footer, so either only ever needs updating in one place.
#
# Stage 2h adds How It Works (how-it-works.html) — a single document, like
# About/Home/Site Settings, since the page has one fixed set of sections
# rather than a growing roster. Its content genuinely changes year to year
# (Hult Prize sets new stage dates/eligibility/prize terms on its own
# schedule), which is exactly why this one was built CMS-editable from the
# start rather than retrofitted later. The SDG grid's icon/accent colors
# are assigned automatically by each entry's position (see HIW_ACCENTS in
# js/script.js) — same reasoning as every other auto-assigned card color on
# this site — so reordering/adding/removing an SDG entry never needs a
# layout decision here.
#
# Every OTHER page (Get Involved) is still untouched, plain HTML, not
# editable here.

backend:
  name: github
  repo: GigiManBigDur/hult-prize-website
  branch: main
  # Points the github backend at this repo's own self-hosted OAuth proxy
  # (api/auth.js + api/callback.js) instead of Decap's Netlify-hosted
  # proxy, which only works for Netlify-deployed sites. base_url +
  # auth_endpoint together must resolve to exactly this deployment's
  # /api/auth route.
  #
  # This project's real Vercel domain (confirmed live — see the project
  # connected via create_git_project in this session's history). If a
  # custom domain is attached later, update this to match and re-register
  # the GitHub OAuth App's callback URL to match too.
  base_url: https://hult-prize-website.vercel.app
  auth_endpoint: api/auth

# Lets `npx decap-server` (run locally, from the repo root) stand in for
# the github backend above when this admin page is opened via
# http://localhost — real local git commits, zero OAuth setup, useful
# for testing collection/field config changes before touching the real
# GitHub flow. Has no effect once this page is opened via its real
# deployed domain: Decap only ever tries the local backend on localhost.
local_backend: true

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: faq
    label: FAQ
    description: >-
      Questions shown on the FAQ page (faq.html), in the order they'll
      appear on the page. This is the ONLY content type this pilot
      manages — every other page on the site is still plain HTML.
    files:
      - name: faq
        label: FAQ Questions
        file: content/faq.json
        format: json
        fields:
          - label: Questions
            name: questions
            widget: list
            summary: "{{fields.question}}"
            fields:
              - label: Question
                name: question
                widget: string
              - label: Answer
                name: answer
                widget: text
                hint: >-
                  Plain text only — links and formatting aren't
                  supported by this pilot's FAQ editor.
              - label: Category
                name: category
                widget: select
                options:
                  - { label: General, value: general }
                  - { label: Getting Started, value: getting-started }
                  - { label: Competition, value: competition }

  - name: team
    label: Team
    description: >-
      Executive board members shown on the Leadership page (team.html),
      in the order they'll appear. Card size, accent color, and the
      overall bento grid layout are assigned automatically by position
      — nothing here controls them, so reordering this list also
      reorders the page. That layout is specifically tuned for 6
      members; adding a 7th or removing one still works, just without
      the same designed arrangement for the extra/missing slot.
    files:
      - name: team
        label: Team Members
        file: content/team.json
        format: json
        fields:
          - label: Members
            name: members
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - label: Name
                name: name
                widget: string
              - label: Role
                name: role
                widget: string
              - label: Bio
                name: bio
                widget: markdown
                minimal: true
                buttons: [bold, italic, link]
                hint: >-
                  Bold, italic, and links only — kept simple on
                  purpose.
              - label: Photo
                name: photo
                widget: image
                media_folder: /assets/leadership
                public_folder: /assets/leadership
                hint: >-
                  Any photo works — the card crops it to fit
                  automatically (square on most cards, wide on a few),
                  nothing is stretched or distorted.

  - name: blog
    label: Blog
    description: >-
      Posts shown on the Blog page's teaser grid (blog.html) and each
      post's own full page (blog-post.html), in the order they'll
      appear. The Newsletter section on that same page is a SEPARATE,
      still-hardcoded piece — nothing here touches it.
    files:
      - name: blog
        label: Blog Posts
        file: content/blog.json
        format: json
        fields:
          - label: Posts
            name: posts
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Category
                name: category
                widget: select
                options: [Recap, Announcement, "Behind the Scenes", Tips]
                hint: >-
                  Drives the post's accent color — every post in a
                  category shares the same color, site-wide.
              - label: Date
                name: date
                # widget: date was removed in Decap CMS 3.x ("No control
                # for widget 'date'" — caught live, testing this stage's
                # config locally before ever touching the real site).
                # datetime + time_format: false is the documented
                # replacement for a date-only field:
                # https://decapcms.org/docs/widgets/datetime/
                widget: datetime
                format: "YYYY-MM-DD"
                time_format: false
              - label: Excerpt
                name: excerpt
                widget: text
                hint: Short summary shown on the teaser card.
              - label: Body
                name: body
                widget: markdown
                hint: The full article — shown only on the post's own page.
              - label: Thumbnail
                name: thumbnail
                widget: image
                media_folder: /assets/blog
                public_folder: /assets/blog

  - name: timeline
    label: Timeline
    description: >-
      Key dates shown on the Timeline page's event track (timeline.html)
      and reflected in the Countdown widget on both that page and the
      Home page — the widget always targets whichever event here is
      soonest, so there's nothing to keep in sync separately. Events are
      sorted by date automatically when the pages render: add a new one
      anywhere in this list, in any order — you do NOT need to insert it
      "in the right place."
    files:
      - name: timeline
        label: Timeline Events
        file: content/timeline.json
        format: json
        fields:
          - label: Events
            name: events
            widget: list
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Date
                name: date
                # widget: date was removed in Decap CMS 3.x — see the
                # identical note on Blog's Date field above.
                widget: datetime
                format: "YYYY-MM-DD"
                time_format: false
              - label: Time
                name: time
                widget: string
                hint: 'Free text, e.g. "6:00 PM" — shown when a card is opened.'
              - label: Location
                name: location
                widget: string
              - label: Description
                name: description
                widget: markdown
                hint: >-
                  Shown in the event's detail view when its card is
                  opened.

  - name: pitch_videos
    label: Pitch Videos
    description: >-
      Slides in the Pitch Video Hub's carousel (pitch-videos.html), in the
      order they'll appear — reorder this list to reorder the carousel.
    files:
      - name: pitch_videos
        label: Pitch Videos
        file: content/pitch-videos.json
        format: json
        fields:
          - label: Videos
            name: videos
            widget: list
            summary: "{{fields.teamName}} ({{fields.placement}})"
            fields:
              - label: Team Name
                name: teamName
                widget: string
              - label: Placement
                name: placement
                widget: select
                options: ["1st", "2nd", "3rd", "None"]
                hint: >-
                  Drives the card's gold/silver/bronze badge for a placed
                  team, or the generic accent styling for "None".
              - label: YouTube Video ID or URL
                name: videoUrl
                widget: string
                hint: >-
                  Only add a real video here if the team has given
                  explicit, separate consent to publish it. A pitch video
                  shows far more about their venture than a name alone
                  would.
              - label: Thumbnail
                name: thumbnail
                widget: image
                media_folder: /assets/pitch-videos
                public_folder: /assets/pitch-videos

  - name: gallery
    label: Gallery
    description: >-
      Photos in the Gallery page's grid (gallery.html), in the order
      they'll appear. This collection is meant to keep growing — add a
      new photo any time, in any order; its tile size and accent color
      are both assigned automatically so the grid stays visually varied
      without any design decision needed here.
    files:
      - name: gallery
        label: Gallery Photos
        file: content/gallery.json
        format: json
        fields:
          - label: Photos
            name: photos
            widget: list
            summary: "{{fields.category}} — {{fields.caption}}"
            fields:
              - label: Caption
                name: caption
                widget: text
                hint: >-
                  Used for accessibility (alt text and the photo viewer's
                  caption) — doesn't need to be a headline.
              - label: Category
                name: category
                widget: select
                options:
                  - { label: "OnCampus 2025", value: oncampus }
                  - { label: Workshops, value: workshops }
                  - { label: Team Life, value: team }
                hint: >-
                  Drives which filter pill(s) this photo appears under —
                  keep to these three so the filters stay meaningful.
              - label: Photo
                name: photo
                widget: image
                media_folder: /assets/gallery
                public_folder: /assets/gallery

  - name: about
    label: About Page
    description: >-
      The single About page (about.html) — its header title, founding
      story, mission/values pillars, ENG 108 partnership section, and
      Built to Last section. This is the site's only single-document
      collection: there's one About page, not a growing list, so editing
      opens straight into its one entry rather than a list of entries.
      Each value pillar's icon and accent color are assigned automatically
      by its position in the list below — do not add icon/color fields;
      reordering or adding/removing a pillar here is all that's needed.
      IMPORTANT: this page covers the CHAPTER'S OWN HISTORY, not the Hult
      Prize competition's current rules, dates, or prize amounts — do not
      state any of those as fact here, since the competition's own current
      terms can change independently of this chapter's story. The
      Leadership/Impact/Get Involved links at the bottom of the page are
      fixed navigation, not editable here.
    files:
      - name: about
        label: About Page
        file: content/about.json
        format: json
        fields:
          - label: Header Title
            name: headerTitle
            widget: string
            hint: >-
              The page's big H1. Keep it short — it's split word-by-word
              for the page's entrance animation.
          - label: Founding Story
            name: foundingStory
            widget: markdown
            hint: >-
              How the chapter started. State only the chapter's own real
              history here — nothing about the Hult Prize competition's
              current rules, dates, or prize amounts as fact.
          - label: Values
            name: values
            widget: list
            summary: "{{fields.name}}"
            hint: >-
              One entry per mission/value pillar. Icon and accent color
              are assigned automatically by each pillar's position in this
              list (cycling through the site's palette/icon set) — reorder,
              add, or remove entries freely; there's nothing else to set.
            fields:
              - label: Name
                name: name
                widget: string
              - label: Description
                name: description
                widget: text
          - label: ENG 108 Partnership Section
            name: eng108Section
            widget: markdown
            hint: >-
              The ENG 108 collaboration callout. Same rule as Founding
              Story: the chapter's own real history only, not the
              competition's current terms.
          - label: Built to Last Section
            name: legacySection
            widget: markdown
            hint: >-
              The chapter's continuity/legacy story. Same rule as Founding
              Story: the chapter's own real history only, not the
              competition's current terms.

  - name: site_settings
    label: Site Settings
    description: >-
      Shared values used in more than one place across the site: the
      Instagram URL (Home page hero, plus every page's footer) and contact
      email (every page's footer). Change either one here and it updates
      everywhere it appears — there's nothing to edit per-page.
    files:
      - name: site_settings
        label: Site Settings
        file: content/site-settings.json
        format: json
        fields:
          - label: Instagram URL
            name: instagramUrl
            widget: string
            hint: 'Full URL, e.g. "https://instagram.com/hultprizeucdavis".'
          - label: Contact Email
            name: contactEmail
            widget: string

  - name: home
    label: Home Page
    description: >-
      The single Home page (index.html) — hero, "What is the Hult Prize?"
      explainer, impact stats, Top Teams podium, Our Story intro, and the
      "Ready to build something that matters?" CTA band. This is a
      single-document collection, like About: there's one Home page, not a
      growing list, so editing opens straight into its one entry.
      HIGH RISK: this page's sections are built on several interlocking
      pinned, scroll-scrubbed animations (the Hero/Explainer/Impact
      sequence, the Top Teams podium reveal + confetti, the Impact
      counting-up numbers, the Our Story fade-in) — always preview a
      change on the live page after publishing, the same way you would for
      any other collection here, but pay extra attention to those
      animations specifically. IMPORTANT: like the About page, this page
      covers the CHAPTER'S OWN HISTORY and current standing, not the Hult
      Prize competition's own current rules, dates, or prize amounts — do
      not state those as fact in the Explainer or Our Story fields. The
      site-wide nav, Instagram/email links (see the separate Site Settings
      collection), and the Countdown widget near the CTA band (which reads
      Timeline dates, not anything here) are not editable on this
      document.
    files:
      - name: home
        label: Home Page
        file: content/home.json
        format: json
        fields:
          - label: Hero Headline
            name: heroHeadline
            widget: string
            hint: >-
              The big scroll-in headline at the top of the page. Keep it
              short — it's split word-by-word for the entrance animation.
          - label: Hero Subtext
            name: heroSubtext
            widget: markdown
          - label: Hero Primary CTA Label
            name: heroCtaLabel
            widget: string
            hint: >-
              Button text only — it always links to the Get Involved page,
              which can't be changed here.
          - label: Hero Background Images
            name: heroBackgroundImages
            widget: list
            field:
              label: Image
              name: image
              widget: image
              media_folder: /assets/hero
              public_folder: /assets/hero
            hint: >-
              2–3 full-bleed photos that slowly crossfade behind the hero
              headline, in display order. Use a wide/landscape,
              high-resolution photo for each — a low-res or tall/portrait
              image will look stretched or awkwardly cropped behind the
              text. The images here now are original placeholder graphics
              (not real photography) — replace them with properly-licensed
              campus photos before launch.
          - label: Hero Corner Tagline
            name: heroCornerTagline
            widget: string
            hint: >-
              Short handwritten-style accent line shown in the hero's
              top-right corner. Keep it to 2–4 short words — it's designed
              to wrap onto a few short lines, not read as one line.
          - label: Explainer Heading
            name: explainerHeading
            widget: string
          - label: Explainer Body
            name: explainerBody
            widget: markdown
            hint: >-
              What the Hult Prize competition is. Verify current prize
              amounts, dates, and eligibility rules against the official
              Hult Prize site (hultprize.org) before stating anything here
              as fact — this is chapter-maintained content, and the
              competition's own current terms can change independently of
              it.
          - label: Impact Stat 1 Number
            name: impactStat1Number
            widget: string
            hint: 'e.g. "20+" — the leading digits are what count up.'
          - label: Impact Stat 1 Description
            name: impactStat1Description
            widget: markdown
          - label: Impact Stat 2 Number
            name: impactStat2Number
            widget: string
            hint: 'e.g. "2" — the leading digits are what count up.'
          - label: Impact Stat 2 Description
            name: impactStat2Description
            widget: markdown
          - label: Our Story Heading
            name: storyHeading
            widget: string
          - label: Our Story Body
            name: storyBody
            widget: markdown
            hint: >-
              The short intro next to the Our Story photo — not the
              Founded/Organized/Partnered/Built to Last milestones below
              it, which stay fixed here (edit the About page's own
              Founding Story/Built to Last fields for those instead).
          - label: Our Story Photo
            name: storyPhoto
            widget: image
            media_folder: /assets/our-story
            public_folder: /assets/our-story
            hint: >-
              A real, specific photo works best here — this is deliberately
              NOT generic stock imagery, same as the rest of this page's
              photography.
          - label: Our Story "Learn More" Link Label
            name: storyLearnMoreLabel
            widget: string
            hint: >-
              Button text only — it always links to the About page, which
              can't be changed here.
          - label: Top Teams Section Title
            name: topTeamsSectionTitle
            widget: string
          - label: Top Teams
            name: topTeams
            widget: list
            summary: "{{fields.placement}} — {{fields.teamName}}"
            hint: >-
              Exactly one entry each for 1st, 2nd, and 3rd place — this
              section's podium and confetti are built for exactly those
              three placements, not an arbitrary list. Reorder entries
              freely: which podium position (and which team gets the
              confetti burst) is decided entirely by each entry's
              Placement field below, never by where it sits in this list.
            fields:
              - label: Team Name
                name: teamName
                widget: string
              - label: Placement
                name: placement
                widget: select
                options: ["1st", "2nd", "3rd"]
                hint: >-
                  Decides the team's podium position, badge color, and
                  (for 1st) the confetti burst — not this list's order.
              - label: Year
                name: year
                widget: string
              - label: Photo
                name: photo
                widget: image
                media_folder: /assets/top-teams
                public_folder: /assets/top-teams
          - label: CTA Band Heading
            name: ctaHeading
            widget: string
          - label: CTA Band Body
            name: ctaBody
            widget: markdown
          - label: CTA Band Photo
            name: ctaPhoto
            widget: image
            media_folder: /assets/cta
            public_folder: /assets/cta
          - label: CTA Band Button Label
            name: ctaButtonLabel
            widget: string
            hint: >-
              Button text only — it always links to the Get Involved page,
              which can't be changed here.

  - name: how_it_works
    label: How It Works
    description: >-
      The single How It Works page (how-it-works.html) — the competition's
      5-stage journey, eligibility, how teams are evaluated, the SDG grid,
      and the official resource links. This is a single-document
      collection, like About/Home/Site Settings: there's one How It Works
      page, not a growing list. IMPORTANT: Hult Prize sets its own stage
      dates, eligibility rules, and prize terms independently, and these
      genuinely change from year to year — always verify anything you
      change here against the official Hult Prize site
      (https://www.hultprize.org/how-it-works) before publishing. The page
      itself also carries a permanent, non-editable reminder of this to
      visitors, so it never implies its content is fixed.
    files:
      - name: how_it_works
        label: How It Works
        file: content/how-it-works.json
        format: json
        fields:
          - label: Intro Text
            name: introText
            widget: markdown
          - label: Stages
            name: stages
            widget: list
            summary: "{{fields.name}} ({{fields.dateRange}})"
            hint: >-
              The 5-stage competition journey, in order — Qualifiers,
              Nationals, Digital Incubator, Global Accelerator, Global
              Finals. Verify current stage names/dates against
              hultprize.org before publishing.
            fields:
              - label: Stage Name
                name: name
                widget: string
              - label: Date Range
                name: dateRange
                widget: string
                hint: 'e.g. "September – February"'
              - label: Description
                name: description
                widget: text
          - label: Eligibility
            name: eligibility
            widget: list
            summary: "{{fields.requirement}}"
            hint: >-
              One entry per eligibility requirement. Verify against
              hultprize.org before publishing — these can change year to
              year.
            field:
              label: Requirement
              name: requirement
              widget: string
          - label: Evaluation Criteria
            name: evaluationCriteria
            widget: list
            summary: "{{fields.name}}"
            fields:
              - label: Criterion Name
                name: name
                widget: string
              - label: Description
                name: description
                widget: text
          - label: SDGs
            name: sdgs
            widget: list
            summary: "{{fields.number}} — {{fields.name}}"
            hint: >-
              All 17 UN Sustainable Development Goals. Icon and accent
              color are assigned automatically by each entry's position in
              this list — reordering is safe, there's nothing else to set.
              Do NOT use the UN's own SDG logos/icons or official color
              coding anywhere (a UN-owned asset with usage restrictions) —
              this grid is deliberately built with this site's own colors
              instead.
            fields:
              - label: Number
                name: number
                widget: number
                value_type: int
                min: 1
                max: 17
              - label: Name
                name: name
                widget: string
              - label: Description
                name: description
                widget: text
              - label: Example Idea
                name: example
                widget: text
                required: false
                hint: >-
                  Optional — not every goal needs one. If you add one,
                  start it with something like "Illustrative example
                  only — not a real venture:" so it's never mistaken for
                  an actual case study.
          - label: Resource Links
            name: resourceLinks
            widget: list
            summary: "{{fields.label}}"
            hint: >-
              Leave URL blank for a link that isn't ready yet (e.g. the
              Competitor Guide Book) — it will show as a clearly-marked
              "Link TBD" card instead of a broken or fabricated link. Never
              link to a third-party re-upload of an official Hult Prize
              document.
            fields:
              - label: Label
                name: label
                widget: string
              - label: URL
                name: url
                widget: string
                required: false
