<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder hero background #2 (original graphic, not a photo) — same
       generic campus-tower silhouette as #1/#3, in a cooler dusk color
       grading, for the hero's crossfade loop to have some variety.
       Replace via the Home Page CMS's "Hero Background Images" field. -->
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0a1e"/>
      <stop offset="40%" stop-color="#22184a"/>
      <stop offset="65%" stop-color="#5a2a63"/>
      <stop offset="85%" stop-color="#a8456a"/>
      <stop offset="100%" stop-color="#d8703f"/>
    </linearGradient>
    <radialGradient id="sun2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf9e" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#e5713f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e5713f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120e1c"/>
      <stop offset="100%" stop-color="#08060e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky2)"/>
  <circle cx="1050" cy="700" r="300" fill="url(#sun2)"/>

  <!-- a few stars, higher up in this cooler/darker frame -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="260" cy="120" r="1.6"/>
    <circle cx="360" cy="90" r="1.4"/>
    <circle cx="500" cy="150" r="1.8"/>
    <circle cx="1180" cy="100" r="1.5"/>
    <circle cx="1300" cy="160" r="1.7"/>
    <circle cx="1420" cy="110" r="1.4"/>
  </g>

  <!-- faint cloud streaks -->
  <g opacity="0.2" fill="#ffffff">
    <ellipse cx="460" cy="260" rx="240" ry="16"/>
    <ellipse cx="1250" cy="340" rx="200" ry="14"/>
  </g>

  <!-- distant low buildings, right side -->
  <g fill="#0a0812">
    <rect x="1100" y="690" width="130" height="160"/>
    <rect x="1250" y="650" width="110" height="200"/>
    <rect x="1370" y="710" width="170" height="140"/>
    <rect x="160" y="750" width="110" height="110"/>
  </g>
  <g fill="#f3c274" opacity="0.7">
    <rect x="1115" y="712" width="10" height="14"/>
    <rect x="1140" y="712" width="10" height="14"/>
    <rect x="1270" y="680" width="10" height="14"/>
    <rect x="1295" y="680" width="10" height="14"/>
    <rect x="1390" y="740" width="10" height="14"/>
  </g>

  <!-- central bell tower -->
  <g fill="#08060e">
    <rect x="765" y="180" width="70" height="620"/>
    <rect x="745" y="150" width="110" height="40"/>
    <polygon points="745,150 800,60 855,150"/>
    <rect x="792" y="30" width="16" height="34"/>
    <rect x="775" y="250" width="50" height="90"/>
    <rect x="775" y="380" width="50" height="90"/>
  </g>
  <g fill="#f3c274" opacity="0.55">
    <rect x="785" y="265" width="10" height="18"/>
    <rect x="805" y="265" width="10" height="18"/>
    <rect x="785" y="395" width="10" height="18"/>
    <rect x="805" y="395" width="10" height="18"/>
  </g>

  <!-- tree silhouettes, left edge -->
  <g fill="#08060e">
    <ellipse cx="100" cy="470" rx="230" ry="270"/>
    <ellipse cx="20" cy="550" rx="190" ry="230"/>
    <rect x="70" y="600" width="30" height="260"/>
  </g>

  <!-- foreground tree line across the bottom -->
  <g fill="url(#ground2)">
    <ellipse cx="480" cy="900" rx="500" ry="140"/>
    <ellipse cx="1020" cy="900" rx="540" ry="130"/>
    <ellipse cx="1460" cy="900" rx="280" ry="110"/>
  </g>
  <rect x="0" y="860" width="1600" height="40" fill="#08060e"/>
</svg>
