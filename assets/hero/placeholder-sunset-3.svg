<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder hero background #3 (original graphic, not a photo) — same
       generic campus-tower silhouette as #1/#2, in a warmer golden-hour
       color grading, for the hero's crossfade loop to have some variety.
       Replace via the Home Page CMS's "Hero Background Images" field. -->
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241638"/>
      <stop offset="32%" stop-color="#4a2452"/>
      <stop offset="58%" stop-color="#c1495c"/>
      <stop offset="80%" stop-color="#f0894a"/>
      <stop offset="100%" stop-color="#ffc463"/>
    </linearGradient>
    <radialGradient id="sun3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0c8" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffb15a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffb15a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1020"/>
      <stop offset="100%" stop-color="#0b0712"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky3)"/>
  <circle cx="1280" cy="560" r="230" fill="url(#sun3)"/>

  <!-- faint cloud streaks -->
  <g opacity="0.28" fill="#ffe4b8">
    <ellipse cx="380" cy="200" rx="280" ry="20"/>
    <ellipse cx="820" cy="140" rx="200" ry="14"/>
    <ellipse cx="1250" cy="260" rx="240" ry="16"/>
  </g>

  <!-- distant low buildings, right side -->
  <g fill="#0e0916">
    <rect x="1140" y="710" width="130" height="140"/>
    <rect x="1280" y="670" width="100" height="180"/>
    <rect x="1390" y="730" width="150" height="120"/>
    <rect x="140" y="730" width="130" height="130"/>
  </g>
  <g fill="#ffd48a" opacity="0.8">
    <rect x="1155" y="730" width="10" height="14"/>
    <rect x="1180" y="730" width="10" height="14"/>
    <rect x="1300" y="700" width="10" height="14"/>
    <rect x="1325" y="700" width="10" height="14"/>
    <rect x="1410" y="760" width="10" height="14"/>
    <rect x="1435" y="760" width="10" height="14"/>
  </g>

  <!-- central bell tower -->
  <g fill="#0b0712">
    <rect x="765" y="180" width="70" height="620"/>
    <rect x="745" y="150" width="110" height="40"/>
    <polygon points="745,150 800,60 855,150"/>
    <rect x="792" y="30" width="16" height="34"/>
    <rect x="775" y="250" width="50" height="90"/>
    <rect x="775" y="380" width="50" height="90"/>
  </g>
  <g fill="#ffd48a" opacity="0.65">
    <rect x="785" y="265" width="10" height="18"/>
    <rect x="805" y="265" width="10" height="18"/>
    <rect x="785" y="395" width="10" height="18"/>
    <rect x="805" y="395" width="10" height="18"/>
  </g>

  <!-- tree silhouettes, left edge -->
  <g fill="#0b0712">
    <ellipse cx="140" cy="490" rx="210" ry="250"/>
    <ellipse cx="55" cy="570" rx="170" ry="210"/>
    <rect x="110" y="600" width="30" height="260"/>
  </g>

  <!-- foreground tree line across the bottom -->
  <g fill="url(#ground3)">
    <ellipse cx="520" cy="900" rx="460" ry="140"/>
    <ellipse cx="1010" cy="900" rx="520" ry="130"/>
    <ellipse cx="1440" cy="900" rx="320" ry="110"/>
  </g>
  <rect x="0" y="860" width="1600" height="40" fill="#0b0712"/>
</svg>
