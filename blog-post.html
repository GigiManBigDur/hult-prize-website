<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- See the matching comment in index.html/team.html/blog.html/etc.:
       opt out of the browser's default scroll-position restoration so a
       reload or a pasted link starts at the top rather than wherever this
       page was last scrolled to. -->
  <script>
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
    window.scrollTo(0, 0);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post | Hult Prize @ UC Davis</title>
  <meta name="description" content="A post from the Hult Prize @ UC Davis blog.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- Same header markup/treatment as the rest of the site. -->
    <!-- Single shared header, every page (all 10 nav pages + blog-post.html)
       — rendered into this mount point by renderSiteHeader() in
       js/script.js, which also wires up the mobile nav drawer
       (initMobileNav) below NAV_COLLAPSE_MIN_WIDTH. Previously each page
       hand-authored its own copy of this markup: the direct cause of an
       earlier navy/gold theme-drift bug, and part of why the nav-overflow
       bug (a mobile-compatibility audit finding) went unfixed as long as
       it did. There is now exactly one copy of this markup to ever edit.
       Home is the one page whose header is also `position: fixed` (see
       `.home-page .site-header--transparent` in css/styles.css) so its
       full-bleed hero photo can extend behind it — driven by the
       `home-page` class on this page's own <body>, not anything here. -->
  <header id="site-header-mount"></header>

  <!-- Stage 2b (Admin CMS extension) — a single template page for every
       blog post, not one file per post: this is a static site with no
       build step to generate individual pages at deploy time, so
       initBlogPostContent (js/script.js) reads ?slug=... off this page's
       own URL, fetches content/blog.json (the same file blog.html's
       teaser grid reads), finds the matching post, and fills in
       everything below at runtime — title, category, date, thumbnail,
       and the full markdown Body rendered to HTML. Every element below
       starts empty/hidden; if the slug doesn't match any post (or
       content/blog.json fails to load), initBlogPostContent shows the
       #blog-post-not-found state instead and leaves the rest of this
       page hidden — see that function for exactly what it fills in and
       how. -->
  <main id="main" class="blog-post-page">
    <article class="blog-post-article reveal-on-scroll" id="blog-post-article" hidden>
      <div class="container">
        <a class="text-link blog-post-back" href="blog.html">&larr; Back to Blog</a>

        <p class="blog-post-category" id="blog-post-category"></p>
        <h1 class="blog-post-title" id="blog-post-title"></h1>
        <p class="blog-post-date" id="blog-post-date"></p>

        <figure class="blog-post-thumb">
          <img id="blog-post-thumb-img" src="" alt="">
        </figure>

        <div class="blog-post-body" id="blog-post-body"></div>
      </div>
    </article>

    <section class="blog-post-not-found" id="blog-post-not-found" hidden>
      <div class="container">
        <h1>Post not found</h1>
        <p>This post may have been moved, renamed, or removed.</p>
        <a class="btn btn-primary" href="blog.html">Back to the Blog</a>
      </div>
    </section>
  </main>

  <!-- Same footer markup/treatment as the rest of the site. -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-name">Hult Prize <span>@ UC Davis</span></p>
      <ul class="footer-links footer-links-icons">
        <li>
          <a class="footer-icon-link" href="mailto:hultprizeucd@gmail.com" aria-label="Email us">
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="24" height="24" rx="6" fill="#3AA9E0"/>
              <path d="M5.5 7.5h13a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M5 8l7 5.2L19 8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </li>
        <li>
          <a class="footer-icon-link" href="https://www.instagram.com/hultprizeatucdavis/" target="_blank" rel="noopener noreferrer" aria-label="Follow us on Instagram">
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="footer-ig-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#FFDC80"/>
                  <stop offset="25%" stop-color="#FCAF45"/>
                  <stop offset="50%" stop-color="#E1306C"/>
                  <stop offset="75%" stop-color="#C13584"/>
                  <stop offset="100%" stop-color="#5851DB"/>
                </linearGradient>
              </defs>
              <rect width="24" height="24" rx="6" fill="url(#footer-ig-gradient)"/>
              <rect x="5" y="5" width="14" height="14" rx="4.5" fill="none" stroke="#fff" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="3.6" fill="none" stroke="#fff" stroke-width="1.6"/>
              <circle cx="16.1" cy="7.9" r="1" fill="#fff"/>
            </svg>
          </a>
        </li>
        <li>
          <a class="footer-icon-link" href="https://discord.gg/RGqkVa2cCa" target="_blank" rel="noopener noreferrer" aria-label="Join our Discord">
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="24" height="24" rx="6" fill="#5865F2"/>
              <rect x="4.5" y="6" width="15" height="11" rx="5" fill="#fff"/>
              <circle cx="8.7" cy="17" r="1.9" fill="#fff"/>
              <circle cx="15.3" cy="17" r="1.9" fill="#fff"/>
              <ellipse cx="9.3" cy="11.3" rx="1.5" ry="1.9" fill="#5865F2"/>
              <ellipse cx="14.7" cy="11.3" rx="1.5" ry="1.9" fill="#5865F2"/>
            </svg>
          </a>
        </li>
      </ul>
      <p class="footer-copyright">&copy; <span id="year"></span> Hult Prize @ UC Davis.</p>
    </div>
  </footer>

  <!-- GSAP: the one thing this page animates is the generic
       .reveal-on-scroll fade + rise on the article itself
       (initScrollReveal, already run unconditionally on every page) — a
       CDN failure or reduced motion just means the article is fully
       visible immediately instead, never hidden. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- Site-wide Search (Stage 11a) — same as every other page. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
  <!-- Renders this post's markdown Body to HTML — same setup/safety
       notes as the Leadership page's bios (Stage 2a): initBlogPostContent
       escapes the raw markdown before handing it to marked.parse, so
       literal HTML in a post can never inject markup, only marked's own
       generated tags from real markdown syntax do. A CDN failure falls
       back to plain escaped text (typeof marked checked before use). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
